name: Runner Pulse - APK firmato permanente
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recupera la chiave privata dall'artifact Genera firma Android
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request, zipfile, io, pathlib
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          url = f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100'
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
              data = json.load(r)
          items = [a for a in data['artifacts'] if a['name'] == 'runner-pulse-keystore-privato' and not a['expired']]
          if not items:
              raise SystemExit('Chiave non disponibile: artifact scaduto. Esegui di nuovo Genera firma Android con le STESSE password, poi riprova.')
          latest = max(items, key=lambda a: a['created_at'])
          with urllib.request.urlopen(urllib.request.Request(latest['archive_download_url'], headers=headers)) as r:
              archive = r.read()
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              candidates = [n for n in z.namelist() if n.endswith('.jks')]
              if len(candidates) != 1:
                  raise SystemExit('Artifact firma non valido')
              dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runnerpulse-release.jks'
              dest.write_bytes(z.read(candidates[0]))
              dest.chmod(0o600)
          print('Chiave recuperata in modo temporaneo per la compilazione.')
          PYCODE
      - name: Compila APK release firmato
        env:
          RP_KEYSTORE_PATH: ${{ runner.temp }}/runnerpulse-release.jks
          RP_KEYSTORE_PASSWORD: ${{ secrets.RUNNER_PULSE_STORE_PASSWORD }}
          RP_KEY_ALIAS: runnerpulse
          RP_KEY_PASSWORD: ${{ secrets.RUNNER_PULSE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verifica firma APK e salva impronta SHA-256
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/firma-apk.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/firma-apk.txt" | sed 's/^.*digest: //' > "$RUNNER_TEMP/sha256.txt"
          test -s "$RUNNER_TEMP/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-Pulse-APK-Firmato-e-SHA256
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/sha256.txt
          retention-days: 30
