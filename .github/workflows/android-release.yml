name: Runner Pulse - APK firmato permanente

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ripristina la chiave privata dai GitHub Secrets
        env:
          RP_KEYSTORE_BASE64: ${{ secrets.RUNNER_PULSE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RP_KEYSTORE_BASE64" || { echo 'Secret RUNNER_PULSE_KEYSTORE_BASE64 mancante'; exit 1; }
          printf '%s' "$RP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/runnerpulse-release.jks"
          test -s "$RUNNER_TEMP/runnerpulse-release.jks" || { echo 'File JKS vuoto'; exit 1; }
          chmod 600 "$RUNNER_TEMP/runnerpulse-release.jks"
          echo 'Chiave ripristinata temporaneamente.'

      - name: Compila APK release firmato
        env:
          RP_KEYSTORE_PATH: ${{ runner.temp }}/runnerpulse-release.jks
          RP_KEYSTORE_PASSWORD: ${{ secrets.RUNNER_PULSE_STORE_PASSWORD }}
          RP_KEY_ALIAS: runnerpulse
          RP_KEY_PASSWORD: ${{ secrets.RUNNER_PULSE_STORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verifica firma APK e salva impronta SHA-256
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/firma-apk.txt"
          awk -F'digest: ' '/certificate SHA-256 digest:/ {print $2; exit}' "$RUNNER_TEMP/firma-apk.txt" > "$RUNNER_TEMP/sha256.txt"
          grep -Eq '^[[:xdigit:]]{64}$' "$RUNNER_TEMP/sha256.txt" || { echo 'Impronta SHA-256 non trovata'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-Pulse-APK-Firmato-e-SHA256
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/sha256.txt
          retention-days: 30
