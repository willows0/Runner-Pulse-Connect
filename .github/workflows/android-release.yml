name: Runner Pulse - APK firmato permanente
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verifica segreti di firma
        env:
          KEYSTORE_B64: ${{ secrets.RP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RP_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Manca RP_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASS" || { echo 'Manca RP_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Manca RP_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASS" || { echo 'Manca RP_KEY_PASSWORD'; exit 1; }
      - name: Ricostruisci keystore in area temporanea
        env:
          KEYSTORE_B64: ${{ secrets.RP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/runnerpulse-release.jks"
          chmod 600 "$RUNNER_TEMP/runnerpulse-release.jks"
      - name: Compila APK release firmato
        env:
          RP_KEYSTORE_PATH: ${{ runner.temp }}/runnerpulse-release.jks
          RP_KEYSTORE_PASSWORD: ${{ secrets.RP_KEYSTORE_PASSWORD }}
          RP_KEY_ALIAS: ${{ secrets.RP_KEY_ALIAS }}
          RP_KEY_PASSWORD: ${{ secrets.RP_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verifica firma APK e salva impronta SHA-256
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/firma-apk.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/firma-apk.txt" | sed 's/^.*digest: //' > "$RUNNER_TEMP/sha256.txt"
          test -s "$RUNNER_TEMP/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-Pulse-APK-Firmato-e-SHA256
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/sha256.txt
          retention-days: 30
