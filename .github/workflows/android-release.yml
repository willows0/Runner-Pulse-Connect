name: Runner Pulse - APK firmato permanente
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recupera la chiave privata dall'artifact Genera firma Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runnerpulse-signing"
          gh run download -R "$GITHUB_REPOSITORY" -n runner-pulse-keystore-privato -D "$RUNNER_TEMP/runnerpulse-signing"
          test -s "$RUNNER_TEMP/runnerpulse-signing/runner-pulse-release.jks" || { echo "Chiave .jks non trovata nell'artifact"; exit 1; }
          mv "$RUNNER_TEMP/runnerpulse-signing/runner-pulse-release.jks" "$RUNNER_TEMP/runnerpulse-release.jks"
          chmod 600 "$RUNNER_TEMP/runnerpulse-release.jks"
          echo 'Chiave recuperata temporaneamente per la compilazione.'
      - name: Compila APK release firmato
        env:
          RP_KEYSTORE_PATH: ${{ runner.temp }}/runnerpulse-release.jks
          RP_KEYSTORE_PASSWORD: ${{ secrets.RUNNER_PULSE_STORE_PASSWORD }}
          RP_KEY_ALIAS: runnerpulse
          # Il keystore è PKCS12: keytool usa la stessa password per store e chiave.
          RP_KEY_PASSWORD: ${{ secrets.RUNNER_PULSE_STORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verifica firma APK e salva impronta SHA-256
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/firma-apk.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/firma-apk.txt" | sed 's/^.*digest: //' > "$RUNNER_TEMP/sha256.txt"
          test -s "$RUNNER_TEMP/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Runner-Pulse-APK-Firmato-e-SHA256
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/sha256.txt
          retention-days: 30
