plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.runnerpulse.connect'
    compileSdk 35
    defaultConfig {
        applicationId 'com.runnerpulse.connect'
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName '1.1-twa'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('RP_KEYSTORE_PATH')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('RP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RP_KEY_ALIAS')
                keyPassword System.getenv('RP_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('RP_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation('androidx.browser:browser') { version { strictly '1.8.0' } }
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha11'
}
